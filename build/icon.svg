<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c35"/>
      <stop offset="1" stop-color="#15161b"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: the body is 824 x 824, centred, with room for its shadow -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- The mission desk: your apps on the side screens, the assistant on the main one, all on one console. -->
  <g filter="url(#soft)">
    <rect x="178" y="352" width="150" height="214" rx="40" fill="#f4f4f7" fill-opacity="0.9"/>
    <rect x="696" y="352" width="150" height="214" rx="40" fill="#f4f4f7" fill-opacity="0.9"/>
    <rect x="352" y="276" width="320" height="366" rx="56" fill="url(#ink)"/>
    <rect x="178" y="694" width="668" height="62" rx="31" fill="#f4f4f7"/>
  </g>
  <!-- The assistant's spark -->
  <path d="M512 352 Q512 459 619 459 Q512 459 512 566 Q512 459 405 459 Q512 459 512 352 Z" fill="#ffffff"/>
</svg>
