name: Bug report
description: Something in Mission Desk doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please leave out personal data: emails, messages, names, and screenshots of your accounts.
        For a security problem, don't use this form: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a Slack workspace
        2. …
  - type: input
    id: version
    attributes:
      label: Mission Desk version
      description: In Settings → About.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: apps
    attributes:
      label: Apps involved
      placeholder: e.g. Gmail, Microsoft Teams, the assistant
