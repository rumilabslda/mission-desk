# Builds Mission Desk for macOS, Windows and Linux when a version tag (v1.2.3) is pushed, and uploads
# the installers to a draft GitHub release. Publish the draft by hand once you've checked it.
# Secrets and how to make them: docs/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # to create the draft release and upload files

jobs:
  # One draft release, made before the builds: three jobs creating it at once could make two drafts,
  # and the one published would miss a platform's files (and its update file).
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Mission Desk ${GITHUB_REF_NAME#v}" --notes "Add this version's CHANGELOG section before publishing."

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: The tag matches package.json
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }

      - run: npm run typecheck
      - run: npm test
        if: runner.os != 'Windows'

      - name: Apple notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then echo "::error::APPLE_API_KEY_P8 is not set; see docs/RELEASING.md"; exit 1; fi
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"

      - name: Build and upload
        run: npx electron-vite build && npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing ("Developer ID Application" certificate, .p12 as base64) and notarization
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows and Linux builds are not signed for now.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }}
